services:
  backend:
    build:
      context: ./control-ingreso-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      APP_STORAGE_EVIDENCIAS_DIR: /app/evidencias
      STORAGE_BIOMETRIC_PATH: /app/storage/biometrics
    volumes:
      - sciem_evidencias:/app/evidencias
      - sciem_biometrics:/app/storage/biometrics
    networks:
      - coolify

  frontend:
    build:
      context: ./control-ingreso-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-2}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - coolify

volumes:
  sciem_evidencias:
  sciem_biometrics:

networks:
  coolify:
    external: true
