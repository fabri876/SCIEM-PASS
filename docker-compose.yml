services:
  windsoft-backend:
    build:
      context: ./control-ingreso-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      APP_STORAGE_EVIDENCIAS_DIR: ${APP_STORAGE_EVIDENCIAS_DIR:-/app/evidencias}
      STORAGE_BIOMETRIC_PATH: ${STORAGE_BIOMETRIC_PATH:-/app/storage/biometrics}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_AUTO_ENABLED: ${BACKUP_AUTO_ENABLED:-false}
      BACKUP_DB_HOST: ${BACKUP_DB_HOST}
      BACKUP_DB_PORT: ${BACKUP_DB_PORT:-5432}
      BACKUP_DB_USER: ${BACKUP_DB_USER}
      BACKUP_DB_NAME: ${BACKUP_DB_NAME}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
    volumes:
      - sciem_evidencias:/app/evidencias
      - sciem_biometrics:/app/storage/biometrics
    networks:
      - coolify

  frontend:
    build:
      context: ./control-ingreso-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "sed -i 's|http://backend:8080|http://windsoft-backend:8080|g' /etc/nginx/conf.d/default.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on:
      - windsoft-backend
    networks:
      - coolify

volumes:
  sciem_evidencias:
  sciem_biometrics:

networks:
  coolify:
    external: true
