spring:
  datasource:
    # prepareThreshold=0 desactiva los "prepared statements" del lado del servidor:
    # el pooler de Supabase en :6543 es modo "transaction" (recicla la conexión física
    # entre transacciones), y esos prepared statements de Hibernate quedan huérfanos
    # cuando eso pasa, causando "bad SQL grammar" al hacer commit.
    url: ${DATABASE_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${DATABASE_USER:postgres.xuyfxhrofzavamwxwpeb}
    driver-class-name: org.postgresql.Driver
  config:
    import: "optional:application-local.yaml"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}