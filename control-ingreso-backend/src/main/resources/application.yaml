spring:
  datasource:
    # prepareThreshold=0 desactiva los "prepared statements" del lado del servidor:
    # el pooler de Supabase en :6543 es modo "transaction" (recicla la conexión física
    # entre transacciones), y esos prepared statements de Hibernate quedan huérfanos
    # cuando eso pasa, causando "bad SQL grammar" al hacer commit.
    url: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.xuyfxhrofzavamwxwpeb
    driver-class-name: org.postgresql.Driver
  config:
    import: "optional:application-local.yaml"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  tomcat:
    max-swallow-size: 12MB
  port: 8080

storage:
  biometric:
    # Ruta fuera de src/main/resources y del directorio público. En producción
    # debe sobrescribirse mediante application-local.yaml o variable de entorno.
    path: ./storage/biometrics

backup:
  enabled: ${BACKUP_ENABLED:false}
  run-once: ${BACKUP_RUN_ONCE:false}
  db:
    host: ${BACKUP_DB_HOST:}
    port: ${BACKUP_DB_PORT:5432}
    user: ${BACKUP_DB_USER:}
    name: ${BACKUP_DB_NAME:postgres}
    password: ${BACKUP_DB_PASSWORD:}
  storage:
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${BACKUP_BUCKET:backups}
  retention:
    max: ${BACKUP_MAX:10}
  auto:
    interval-days: ${BACKUP_INTERVAL_DAYS:3}
    enabled: ${BACKUP_AUTO_ENABLED:false}